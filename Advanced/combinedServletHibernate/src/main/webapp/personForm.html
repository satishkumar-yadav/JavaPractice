<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Person Details</title>
</head>
<body>
       <form action="personInfo">
        <label>Person Information</label>
         Enter Person Name : <input type="text" name="user-name"><br></br>
         Enter Phone-no : <input type="text" name="user-phone"><br></br>
         Enter Email : <input type="text" name="user-email"><br></br>
        
         <label>Person Address</label>
         Enter House Number : <input type="number" name="housenumber"><br></br>
         Enter Area : <input type="text" name="area"><br></br>
         Enter City : <input type="text" name="city"><br></br>
         Enter Pin Code : <input type="number" name="pincode"><br></br>
        <input type="submit" value="SUBMIT">
     </form>
</body>
</html>
